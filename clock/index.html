<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --purple:#a98bf0;
    --purple-deep:#7b5ad6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:transparent}
  body{display:flex;align-items:center;justify-content:center;padding:6px;font-family:Inter,system-ui,sans-serif}
  .card{
    position:relative;width:100%;max-width:520px;aspect-ratio:2.15/1;
    border-radius:28px;overflow:hidden;color:#fff;
    background:
      radial-gradient(120% 90% at 85% 15%, rgba(255,255,255,.18) 0%, rgba(255,255,255,0) 45%),
      radial-gradient(90% 120% at 10% 110%, rgba(169,139,240,.35) 0%, rgba(169,139,240,0) 55%),
      radial-gradient(60% 80% at 55% 60%, rgba(255,255,255,.07) 0%, rgba(0,0,0,0) 70%),
      linear-gradient(135deg,#1b1b1f 0%,#0d0d10 55%,#1a1720 100%);
    box-shadow:0 10px 30px rgba(0,0,0,.18);
  }
  /* silk folds */
  .card::before{
    content:"";position:absolute;inset:-20%;
    background:
      repeating-radial-gradient(ellipse at 70% 30%, rgba(255,255,255,.035) 0 18px, rgba(255,255,255,0) 18px 46px);
    transform:rotate(-12deg);filter:blur(6px);pointer-events:none;
  }
  .time{
    position:absolute;right:4%;top:50%;transform:translateY(-52%);
    font-weight:800;letter-spacing:-.04em;line-height:1;
    font-size:clamp(64px,24vw,150px);
    color:rgba(255,255,255,.22);
    font-variant-numeric:tabular-nums;
    text-shadow:0 0 40px rgba(169,139,240,.25);
  }
  .time .colon{animation:blink 2s steps(1) infinite;color:var(--purple);opacity:.85}
  @keyframes blink{50%{opacity:.25}}
  .pill{
    position:absolute;left:6%;top:12%;
    display:inline-flex;align-items:center;gap:6px;
    background:var(--purple);color:#fff;
    font-weight:700;font-size:clamp(10px,2.6vw,14px);
    padding:5px 11px;border-radius:999px;
    box-shadow:0 4px 14px rgba(123,90,214,.45);
  }
  .pill i{width:6px;height:6px;border-radius:50%;background:#fff;display:inline-block}
  .day{
    position:absolute;left:6%;bottom:27%;
    font-family:"Great Vibes",cursive;font-size:clamp(34px,11vw,64px);
    line-height:1;text-shadow:0 2px 12px rgba(0,0,0,.4);
  }
  .date{
    position:absolute;left:6.5%;bottom:13%;
    font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    font-size:clamp(12px,3.4vw,18px);
  }
  .date b{color:var(--purple);font-weight:800}
</style>
</head>
<body>
  <div class="card" role="img" aria-label="Clock">
    <div class="pill"><i></i><span id="greet">Good afternoon</span></div>
    <div class="time"><span id="h">00</span><span class="colon">:</span><span id="m">00</span></div>
    <div class="day" id="day">Saturday</div>
    <div class="date" id="date">31 October</div>
  </div>
<script>
  const days=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const months=["January","February","March","April","May","June","July","August","September","October","November","December"];
  function greet(h){
    if(h<5) return "Good night";
    if(h<12) return "Good morning";
    if(h<18) return "Good afternoon";
    if(h<23) return "Good evening";
    return "Good night";
  }
  function tick(){
    const d=new Date();
    document.getElementById("h").textContent=String(d.getHours()).padStart(2,"0");
    document.getElementById("m").textContent=String(d.getMinutes()).padStart(2,"0");
    document.getElementById("day").textContent=days[d.getDay()];
    document.getElementById("date").innerHTML=d.getDate()+" "+months[d.getMonth()]+" <b>·</b> "+d.getFullYear();
    document.getElementById("greet").textContent=greet(d.getHours());
  }
  tick(); setInterval(tick,1000);
</script>
</body>
</html>
