<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wedding Countdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#c9a97a;
    --gold-deep:#a8865a;
    --ink:#5a4a3a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:transparent}
  body{display:flex;align-items:center;justify-content:center;padding:6px;font-family:Inter,system-ui,sans-serif}
  .card{
    position:relative;width:100%;max-width:520px;aspect-ratio:2.15/1;
    border-radius:28px;overflow:hidden;color:var(--ink);
    background:
      radial-gradient(120% 90% at 85% 15%, rgba(255,255,255,.75) 0%, rgba(255,255,255,0) 50%),
      radial-gradient(90% 120% at 10% 110%, rgba(201,169,122,.28) 0%, rgba(201,169,122,0) 55%),
      radial-gradient(60% 80% at 55% 60%, rgba(255,255,255,.35) 0%, rgba(255,255,255,0) 70%),
      linear-gradient(135deg,#f3ece2 0%,#e6dccd 55%,#efe6da 100%);
    box-shadow:0 10px 30px rgba(120,95,60,.18);
  }
  /* silk folds */
  .card::before{
    content:"";position:absolute;inset:-20%;
    background:
      repeating-radial-gradient(ellipse at 70% 30%, rgba(255,255,255,.28) 0 18px, rgba(255,255,255,0) 18px 46px);
    transform:rotate(-12deg);filter:blur(7px);pointer-events:none;
  }
  /* pearls */
  .pearls{position:absolute;right:5%;bottom:11%;display:flex;gap:7px}
  .pearls i{width:9px;height:9px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fff 0%,#f4eee6 40%,#d9cdbd 100%);
    box-shadow:0 1px 3px rgba(120,95,60,.35)}
  .num{
    position:absolute;right:4%;top:50%;transform:translateY(-56%);
    font-weight:800;letter-spacing:-.04em;line-height:1;
    font-size:clamp(64px,24vw,150px);
    color:rgba(168,134,90,.28);
    font-variant-numeric:tabular-nums;
    text-shadow:0 0 40px rgba(255,255,255,.6);
  }
  .pill{
    position:absolute;left:6%;top:12%;
    display:inline-flex;align-items:center;gap:6px;
    background:var(--gold);color:#fff;
    font-weight:700;font-size:clamp(10px,2.6vw,14px);
    padding:5px 11px;border-radius:999px;
    box-shadow:0 4px 14px rgba(168,134,90,.4);
  }
  .pill i{width:6px;height:6px;border-radius:50%;background:#fff;display:inline-block}
  .script{
    position:absolute;left:6%;bottom:27%;
    font-family:"Great Vibes",cursive;font-size:clamp(34px,11vw,64px);
    line-height:1;color:#4a3b2c;text-shadow:0 2px 12px rgba(255,255,255,.7);
  }
  .date{
    position:absolute;left:6.5%;bottom:13%;
    font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    font-size:clamp(12px,3.4vw,18px);color:var(--ink);
  }
  .date b{color:var(--gold-deep);font-weight:800}
</style>
</head>
<body>
  <div class="card" role="img" aria-label="Wedding countdown">
    <div class="pill"><i></i><span id="pill">Save the date</span></div>
    <div class="num" id="num">0</div>
    <div class="script" id="script">days to go</div>
    <div class="date" id="date"></div>
    <div class="pearls"><i></i><i></i><i></i></div>
  </div>
<script>
  // Set your date in the link: .../countdown/?date=2027-08-14&names=Anna%20%26%20Max
  const months=["January","February","March","April","May","June","July","August","September","October","November","December"];
  const p=new URLSearchParams(location.search);
  const raw=p.get("date")||"2027-08-14";
  const names=p.get("names");
  const [y,m,d]=raw.split("-").map(Number);
  const target=new Date(y,(m||1)-1,d||1);
  if(names) document.getElementById("pill").textContent=names;
  document.getElementById("date").innerHTML=target.getDate()+" "+months[target.getMonth()]+" <b>·</b> "+target.getFullYear();
  function tick(){
    const now=new Date();
    const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
    const days=Math.round((target-today)/86400000);
    const num=document.getElementById("num"), sc=document.getElementById("script");
    if(days>0){num.textContent=days;sc.textContent=days===1?"day to go":"days to go";}
    else if(days===0){num.textContent="0";sc.textContent="Today is the day";}
    else{num.textContent=Math.abs(days);sc.textContent="Just married";}
  }
  tick(); setInterval(tick,60000);
</script>
</body>
</html>
